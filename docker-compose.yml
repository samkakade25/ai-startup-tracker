services:

  postgres:
    image: postgres:16
    container_name: ai_tracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_startup_tracker
      POSTGRES_USER: ai_tracker
      POSTGRES_PASSWORD: ai_tracker_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ai_tracker_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: